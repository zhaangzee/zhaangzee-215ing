<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="以黄金为锚的金融底层逻辑交互学习框架：6 个模块、18 道自测、相似题重测与判断句生成器。">
<meta name="theme-color" content="#17201c">
<title>金融底层逻辑学习框架 · 以黄金为锚</title>
<style>
  :root{
    --bg:#f3f4f1; --card:#ffffff; --ink:#17201c; --sub:#5e6862; --line:#dfe3df;
    --brand:#a8730f; --brand-ink:#795006; --brand2:#176b51; --ok:#176b45; --bad:#b33a2d;
    --soft:#edf2ee; --soft-gold:#faf4e7; --header:#17201c;
    --shadow:0 10px 30px rgba(23,32,28,.07);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased}
  button,select{font:inherit}
  button{color:inherit}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .skip-link{position:absolute;left:16px;top:-60px;z-index:50;background:#fff;color:var(--ink);padding:8px 14px;border-radius:6px}
  .skip-link:focus{top:16px}
  .hero{background:var(--header);color:#f8f6ee;border-bottom:4px solid var(--brand)}
  .hero-inner{max-width:1120px;margin:0 auto;padding:42px 24px 34px;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,.75fr);gap:48px;align-items:end}
  .eyebrow{margin:0 0 10px;color:#d9b76e;font-size:13px;font-weight:650}
  .hero h1{margin:0;font-size:34px;line-height:1.2;font-weight:680;color:#fff}
  .hero-lede{max-width:700px;margin:14px 0 0;color:#dce1dc;font-size:15px}
  .meta-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
  .meta-row span{padding:4px 10px;border:1px solid #455149;border-radius:999px;color:#dce1dc;font-size:12px}
  .anchor-note{padding:2px 0 2px 22px;border-left:2px solid var(--brand)}
  .anchor-label{display:block;color:#d9b76e;font-size:12px;font-weight:650}
  .anchor-note strong{display:block;margin-top:5px;color:#fff;font-size:20px;line-height:1.45;font-weight:650}
  .anchor-note p{margin:8px 0 0;color:#bcc5be;font-size:13px}
  .toolbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);box-shadow:0 5px 18px rgba(23,32,28,.05)}
  .progress-row{max-width:1120px;margin:0 auto;padding:11px 24px 9px;display:grid;grid-template-columns:auto minmax(120px,1fr) auto;gap:18px;align-items:center}
  .progress-copy{display:flex;align-items:baseline;gap:8px;font-size:13px;white-space:nowrap}
  .progress-copy strong{font-size:15px;color:var(--brand2)}
  .bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden}
  .bar > i{display:block;height:100%;width:0;background:var(--brand2);transition:width .3s}
  .toolbar-actions{display:flex;gap:6px}
  .tool-btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer}
  .tool-btn:hover{border-color:#aeb7b0;background:#fafbfa}
  .chapter-nav{max-width:1120px;margin:0 auto;padding:0 24px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
  .chapter-btn{position:relative;flex:none;border:0;background:transparent;padding:9px 12px 10px;color:var(--sub);font-size:12px;cursor:pointer;white-space:nowrap}
  .chapter-btn::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:2px;background:transparent}
  .chapter-btn:hover{color:var(--ink)}
  .chapter-btn.active{color:var(--brand2);font-weight:650}
  .chapter-btn.active::after{background:var(--brand2)}
  .page{max-width:880px;margin:0 auto;padding:28px 24px 40px}
  .section-head{display:flex;justify-content:space-between;gap:24px;align-items:end;margin-bottom:14px}
  .section-head h2{margin:0;font-size:20px;font-weight:680}
  .section-head p{margin:0;color:var(--sub);font-size:13px}
  .module{scroll-margin-top:132px;background:var(--card);border:1px solid var(--line);border-radius:8px;margin:14px 0;overflow:hidden;box-shadow:var(--shadow)}
  .module.open{border-color:#bdc9c1}
  .mhead{width:100%;padding:16px 18px;display:flex;align-items:center;gap:12px;border:0;border-bottom:1px solid transparent;background:transparent;text-align:left;cursor:pointer}
  .module.open .mhead{border-bottom-color:var(--line)}
  .mhead:hover{background:#fafbfa}
  .mhead .no{width:30px;height:30px;border-radius:6px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:680;font-size:13px;flex:none}
  .mhead-title{font-size:17px;font-weight:650;flex:1;line-height:1.45}
  .mhead .tag{font-size:12px;color:var(--sub);text-align:right;max-width:270px}
  .mhead .state{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--sub);white-space:nowrap}
  .mhead .state.done{background:#e6f4ea;color:var(--ok)}
  .chevron{width:18px;height:18px;flex:none;color:var(--sub);transition:transform .2s}
  .module.open .chevron{transform:rotate(180deg)}
  .mbody{padding:4px 20px 20px;display:none}
  .module.open .mbody{display:block}
  .block{padding:15px 0;border-bottom:1px dashed var(--line)}
  .block:last-child{border-bottom:none}
  .lab{display:inline-block;font-size:11px;font-weight:680;padding:2px 9px;border-radius:4px;margin-bottom:7px;border:1px solid}
  .lab.what{background:#edf3f8;color:#245a82;border-color:#d8e5ee}
  .lab.why{background:var(--soft-gold);color:var(--brand-ink);border-color:#ebdcb9}
  .lab.case{background:#f1edf7;color:#624987;border-color:#e2d9ec}
  .block p{margin:6px 0;font-size:14.5px}
  .block ul,.block ol{margin:6px 0;padding-left:22px;font-size:14px}
  .block li{margin:3px 0}
  .hl{background:#f9edc9;padding:0 3px;border-radius:3px}
  .chain{background:#f7f9fc;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:13.5px}
  .chain b{color:var(--brand2)}
  .quiz{margin-top:16px;background:var(--soft);border:1px solid #dbe5de;border-radius:8px;padding:15px}
  .quiz h3{margin:0 0 10px;font-size:15px;color:var(--brand2)}
  .q{min-width:0;margin:12px 0;padding:13px;border:1px solid var(--line);border-radius:6px;background:#fff}
  .q .qt{font-size:14.5px;font-weight:500;margin-bottom:8px}
  .opt{display:block;padding:8px 10px;margin:5px 0;border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:14px;transition:border-color .15s,background .15s}
  .opt:hover{border-color:#bda25e;background:#fffdf8}
  .opt input{margin-right:8px}
  .opt.correct{border-color:var(--ok);background:#e9f7ef}
  .opt.wrong{border-color:var(--bad);background:#fdecea}
  .qbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .qbtns button{border-radius:6px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer}
  .b-sub{background:var(--brand2);color:#fff}
  .b-sim{background:#fff;border:1px solid var(--brand2);color:var(--brand2)}
  .b-next{background:var(--brand);color:#fff}
  .b-sub:disabled{opacity:.5;cursor:not-allowed}
  .fb{margin-top:10px;font-size:13.5px;padding:10px;border-radius:6px;display:none}
  .fb.ok{display:block;background:#e9f7ef;color:#145a32;border:1px solid #bfe6cd}
  .fb.no{display:block;background:#fdecea;color:#7b241c;border:1px solid #f5b7b1}
  .fb b{font-weight:600}
  .gen{margin-top:12px;background:var(--soft-gold);border:1px solid #ead9b0;border-radius:8px;padding:14px}
  .gen h3{margin:0 0 10px;font-size:15px;color:var(--brand-ink)}
  .gen .row{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
  .gen select{font-size:13px;padding:6px 8px;border:1px solid #d8c69f;border-radius:6px;background:#fff;color:var(--ink)}
  .gen #sentenceOut{margin-top:12px;padding:12px;background:#fff;border:1px dashed var(--brand);border-radius:6px;font-size:14.5px;line-height:1.8;min-height:48px}
  table.mat{width:100%;border-collapse:collapse;margin:8px 0;font-size:13px}
  table.mat th,table.mat td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
  table.mat th{background:var(--soft);font-weight:600}
  .disclaimer{font-size:12.5px;color:var(--sub);background:#fafbfa;border:1px solid var(--line);border-radius:8px;padding:13px 15px;margin-top:20px}
  .site-foot{padding:0 0 34px;color:var(--sub);font-size:12px;text-align:center}
  .site-foot a{color:var(--brand-ink)}
  button:focus-visible,select:focus-visible,.opt:focus-within,.skip-link:focus{outline:3px solid #d5ad54;outline-offset:2px}
  @media (max-width:820px){
    .hero-inner{grid-template-columns:1fr;gap:26px;padding-top:32px}
    .anchor-note{max-width:520px}
    .mhead .tag{display:none}
  }
  @media (max-width:620px){
    .hero-inner{padding:28px 18px 26px}
    .hero h1{font-size:25px}
    .hero-lede{font-size:14px}
    .anchor-note strong{font-size:17px}
    .progress-row{grid-template-columns:1fr auto;padding:9px 18px}
    .bar{grid-column:1 / -1;grid-row:2}
    .progress-copy{grid-column:1;grid-row:1}
    .toolbar-actions{grid-column:2;grid-row:1}
    .chapter-nav{padding:0 12px}
    .toolbar-actions .tool-btn:first-child{display:none}
    .page{padding:22px 14px 30px}
    .section-head{display:block}
    .section-head p{margin-top:4px}
    .module{scroll-margin-top:128px}
    .mhead{padding:14px;gap:9px;align-items:flex-start}
    .mhead .no{margin-top:1px}
    .mhead-title{font-size:15px}
    .mhead .state{display:none}
    .mbody{padding:2px 14px 14px}
    .block p{font-size:14px}
    .quiz{padding:12px}
    .q{padding:11px}
    table.mat{display:block;overflow-x:auto;white-space:nowrap}
  }
</style>

      <p class="hero-lede">以黄金为锚，沿「机会成本 → 美元 → 信用风险」理解宏观数据如何传导到资产价格。每个模块配 3 道自测，答错会给出解析并进入相似题重测。</p>
      <div class="meta-row" aria-label="课程概况">

<script>
/* ============== 课程数据 ============== */
const COURSE = [
  /* ---------- 模块一 ---------- */
  {
    title:"模块一 · 黄金是什么",
    short:"黄金是什么",
    sub:"先建立共识：为什么人类千年选了黄金",
    blocks:[
      {lab:"what",cls:"what",html:`<p><b>黄金</b>是一种化学元素（Au），物理上<b>稀缺、稳定不易腐蚀、易分割、易携带</b>。人类几千年来把它当货币、当储备，今天它既是<b>商品</b>（首饰、工业用金），也是<b>金融资产</b>（避险、抗通胀、各国央行储备）。</p>`},
      {lab:"why",cls:"why",html:`<p>底层逻辑只有一句话：<span class="hl">黄金的价值来自“无信用风险的天然共识”，而不依赖任何政府背书。</span></p>
        <p>对比一下你就懂了——你手里的纸币（法币）值钱，是因为“国家信用 + 法律强制”；而黄金值钱，是因为<b>不管哪个国家、哪场战争，人们都认它</b>。这条区别，是后面所有金融逻辑的起点。</p>
        <p>完整定价公式可以记为：<b>黄金价格 = 持有它的机会成本 + 持有它的保险价值</b>。美债实际收益率决定机会成本，美元决定计价与全球购买力，风险事件、美元信用和央行购金决定保险溢价与长期需求。记住这个“两分法”，后面所有指标都能归到这两类里去。</p>`},
    ],
    quiz:[
      {q:"黄金被人类沿用作货币/储备数千年，最核心的原因是？",
       o:["A. 地球上产量最高","B. 颜色最好看","C. 天然稀缺、稳定、跨文明共识、不依赖政府背书","D. 最容易大量印刷"],
       a:2,
       e:"黄金的“信任”来自物理属性（稀缺、不易腐蚀、易分割）和跨文明共识，不依赖任何国家信用——这正是它和法币的根本区别。",
       sim:[
        {q:"同样是“钱”，黄金和纸币（法币）的根本区别是？",o:["A. 黄金更重","B. 黄金价值靠物理属性与跨文明共识，法币靠国家信用与法律强制","C. 黄金能吃","D. 法币不能分割"],a:1,e:"法币值钱靠“国家信用+法律强制”，黄金值钱靠“无信用风险的天然共识”，这是二者本质差异。"},
        {q:"黄金价格由哪两部分共同决定？",o:["A. 重量与颜色","B. 机会成本 + 保险价值","C. 开采成本 + 运费","D. 供需 + 情绪"],a:1,e:"黄金价格 = 持有它的机会成本 + 持有它的保险价值，前者由实际利率决定，后者由风险/信用/央行需求决定。"}
       ]},
      {q:"“黄金价格 = 机会成本 + 保险价值”中，“机会成本”主要由什么决定？",
       o:["A. 黄金的重量","B. 美债实际收益率","C. 首饰工费","D. 美元符号印刷量"],
       a:1,
       e:"美债实际收益率（TIPS）决定持有零息黄金的机会成本：实际利率越高，持有黄金越“贵”，金价承压。",
       sim:[
        {q:"“保险价值”这一部分，主要由哪些因素提供？",o:["A. 工费与运费","B. 风险事件、美元信用、央行购金","C. 黄金颜色","D. 交易所手续费"],a:1,e:"保险溢价与长期需求来自战争/地缘、美元信用担忧、去美元化与央行持续购金。"},
        {q:"为什么黄金“不生息”这件事很重要？",o:["A. 因为它轻","B. 因为不生息，所以持有它的代价就是放弃了美债能给你的利息（机会成本）","C. 因为它闪","D. 因为它便宜"],a:1,e:"零息资产的“代价”就是放弃的实际利率收益，这正是机会成本链的起点。"}
       ]},
      {q:"把黄金和法币对比，下面哪句最贴近底层逻辑？",
       o:["A. 黄金和纸币一样靠政府背书","B. 黄金的价值来自无信用风险的天然共识，不依赖政府","C. 黄金是最近才被认可的","D. 法币比黄金更“天然”"],
       a:1,
       e:"黄金的信任不依赖任何政府，而法币依赖国家信用；这正是理解后续“信用危机时黄金反而涨”的钥匙。",
       sim:[
        {q:"为什么“信用动摇”时黄金往往被追捧？",o:["A. 因为它能发电","B. 因为它是少数不依赖单一国家信用、跨文明的共识资产，是对信用风险的保险","C. 因为它重","D. 因为金价低"],a:1,e:"当人们对某国货币/美债信用生疑，黄金作为“无信用风险”的标的就成了保险。"}
       ]},
    ]
  },
  /* ---------- 模块二 ---------- */
  {
    title:"模块二 · 四层传导：从数据到金价的完整链路",
    short:"四层传导",
    sub:"为什么指标只是入口，真正决定方向的是预期与利率",
    blocks:[
      {lab:"what",cls:"what",html:`<p>把分析拆成<b>四层</b>，从宏观数据一路传导到金价：</p>
        <div class="chain"><b>第1层 宏观状态</b>：CPI、PCE、PPI、非农、失业率、时薪、GDP、初请 → 判断是需求型通胀、供给型通胀、软着陆还是衰退（只定方向，不直接定价）。</div>
        <div class="chain"><b>第2层 政策预期</b>：美联储加息/降息、点阵图、QT/QE、官员表态 → 转换成未来名义利率与美元路径（转鹰压金、转鸽利多）。</div>
        <div class="chain"><b>第3层 定价锚</b>：名义收益率、通胀预期、TIPS 实际收益率、美元指数 → 判断实际利率方向和美元方向（实际利率下行、美元走弱 = 黄金核心顺风）。</div>
        <div class="chain"><b>第4层 风险与结构</b>：战争、地缘、美债上限、制裁、去美元化、央行购金 → 转换成避险溢价、信用溢价与长期官方需求（短期可压倒利率逻辑，长期抬高底部）。</div>`},
      {lab:"why",cls:"why",html:`<p>为什么是这四层？因为<b>指标本身不直接给黄金定价</b>——它们先改变“美联储会怎么做”的预期，预期改变名义利率和美元，再和通胀预期汇合决定实际利率，最后由风险结构叠加保险溢价。所以你看到 CPI，第一反应不该是“通胀高=买黄金”，而是“这个数据会把第2、3层的预期往哪推”。</p>
        <p><b>必须记牢的四条规则：</b></p>
        <ul>
          <li>① <span class="hl">实际利率方向比通胀绝对高低更重要</span>——高通胀若伴随名义利率上行更慢，实际利率反而下行，黄金可能涨。</li>
          <li>② 就业和 GDP 先改变美联储预期（经济强→通胀韧→加息预期）。</li>
          <li>③ 美元与黄金正常负相关，<b>危机时可能同涨</b>（都当避险资产）。</li>

      {lab:"why",cls:"why",html:`<p><b>实战七步（按顺序）：</b></p>

          <li>宏观状态：需求型/供给型通胀、软着陆还是衰退？</li>
          <li>政策预期：加息/降息定价在上修还是下修？</li>
          <li>实际利率：TIPS 实际收益率方向上行还是下行？</li>
          <li>美元：走强是正常周期还是危机避险？</li>
          <li>风险溢价：地缘/债务/制裁风险升级还是缓和？</li>
          <li>结构需求：央行是否持续净购金、去美元化延续？</li>
          <li>价格确认：价格/量/持仓/ETF 是否验证逻辑？</li>
        </ol>
        <p><b>总纲</b>：黄金中短期交易“美联储路径 + 美元实际利率”，长周期底部由美元信用、地缘、去美元化、央行购金共同抬高。<span class="hl">先定环境，再定主链，再用例外校正，最后用价格确认。</span></p>
        <p><b>判断句模板</b>：在【宏观情景】下，因为【主要矛盾】推动美联储【转鹰/转鸽/观望】，所以实际利率大概率【上行/下行】、美元【走强/走弱】、风险溢价【上升/下降】；因此黄金中短期偏【多/空/震荡】。若出现【信用/流动性/供给/政策预期反转】，则以上逻辑需重新定价。</p>`},
      {lab:"case",cls:"case",html:`<p><b>情景矩阵（同一数据，不同环境结果不同）：</b></p>
        <table class="mat">
          <tr><th>情景</th><th>通胀</th><th>增长/就业</th><th>美联储</th><th>黄金基准</th></tr>
          <tr><td>软着陆/金发姑娘</td><td>降温</td><td>稳定</td><td>观望或小降</td><td>偏多</td></tr>
          <tr><td>高通胀+强就业</td><td>高</td><td>强</td><td>偏鹰</td><td>偏空</td></tr>
          <tr><td>滞胀</td><td>高</td><td>弱</td><td>两难</td><td>偏多但波动大</td></tr>
          <tr><td>衰退/降息</td><td>下行</td><td>弱</td><td>降息</td><td>偏多</td></tr>
          <tr><td>流动性危机</td><td>不定</td><td>恶化</td><td>宽松救市</td><td>先跌后涨</td></tr>
          <tr><td>美债/美元信用危机</td><td>次要</td><td>不定</td><td>被动</td><td>偏多（收益率可同涨）</td></tr>
          <tr><td>地缘+原油冲击</td><td>上行</td><td>走弱</td><td>难宽松</td><td>偏多但震荡</td></tr>
          <tr><td>央行购金/去美元化</td><td>影响小</td><td>影响小</td><td>长期影响</td><td>长期偏多</td></tr>
        </table>`},
      {lab:"what",cls:"what",html:`<div class="gen">
        <h3>🧪 判断句生成器（选完自动造句）</h3>
        <div class="row">
          <select id="s1" aria-label="宏观情景"><option>软着陆/金发姑娘</option><option>高通胀+强就业</option><option>滞胀</option><option>衰退/降息</option><option>流动性危机</option><option>美债/美元信用危机</option><option>地缘+原油冲击</option><option>央行购金/去美元化</option></select>
          <select id="s2" aria-label="主要矛盾"><option>通胀受控、就业走弱</option><option>通胀黏性、就业强劲</option><option>油价冲击推升通胀</option><option>衰退与信用担忧</option><option>债务上限/制裁/去美元化</option></select>
          <select id="s3" aria-label="美联储政策方向"><option>转鸽</option><option>转鹰</option><option>观望</option></select>
          <select id="s4" aria-label="实际利率方向"><option>下行</option><option>上行</option></select>
          <select id="s5" aria-label="美元方向"><option>走弱</option><option>走强</option><option>危机时同涨</option></select>
          <select id="s6" aria-label="风险溢价方向"><option>下降</option><option>上升</option></select>
          <select id="s7" aria-label="黄金中短期判断"><option>多</option><option>空</option><option>震荡</option></select>
        </div>
        <div id="sentenceOut"></div>
      </div>`},
    ],
    quiz:[
      {q:"实战七步里，第 7 步“价格确认”要你做的是？",
       o:["A. 只看宏观观点","B. 用价格、成交量、持仓、ETF 资金流验证宏观逻辑，避免只有观点没有确认","C. 忽略价格","D. 只看新闻"],
       a:1,
       e:"宏观观点必须过价格与资金流验证；价格背离逻辑、关键支撑失守时，要怀疑原判断。",
       sim:[
        {q:"总纲说“先定环境，再定主链，再用例外校正，最后用价格确认”，其中“例外”指什么？",o:["A. 五大反转类的反常情况（信用/流动性/供给冲击）","B. 新闻标题","C. 金价颜色","D. 交易量"],a:0,e:"例外即五大反转与情景矩阵中的条件性重定价情形。"},
        {q:"为什么“不只判断方向，还要看幅度与是否已定价”？",o:["A. 因为市场常提前交易预期，利好出尽不涨反跌","B. 因为方向没用","C. 因为价格随机","D. 因为只看方向更简单"],a:0,e:"预期差与提前定价决定行情大小，光判方向不够。"}
       ]},
      {q:"判断句模板中“若出现信用/流动性/政策预期反转，则重新定价”说明？",
       o:["A. 模板永不改","B. 例外条件会推翻主链逻辑，必须动态校正","C. 只信模板","D. 反转不存在"],
       a:1,
       e:"五大反转与情景矩阵的存在，就是提醒主链会被信用危机、流动性危机等例外推翻。",
       sim:[
        {q:"情景矩阵的核心价值是？",o:["A. 证明金价只跟一种环境","B. 同一数据在不同宏观环境下结果不同，须先定环境再判方向","C. 矩阵没用","D. 只记一种情形"],a:1,e:"先定环境，是七步法的第1步，也是避免误判的前提。"}
       ]},
      {q:"黄金的长周期底部，主要由什么共同抬高？",
       o:["A. 短期情绪","B. 美元信用、地缘风险、去美元化、央行购金","C. 工费","D. 新闻标题"],
       a:1,
       e:"中短期看美联储路径与实际利率，长周期底部由美元信用、地缘、去美元化、央行购金抬高——这正是框架的总纲。",
       sim:[
        {q:"“中短期交易美联储路径+实际利率，长期看信用/央行购金”这句话区分了什么？",o:["A. 区分时间尺度：短看利率，长看结构与信用","B. 区分颜色","C. 区分重量","D. 没有区分"],a:0,e:"不混时间尺度是“四个不要”之一，短期节奏与长期趋势要用不同变量。"}
       ]},
    ]
  },
];

/* ============== 渲染与交互 ============== */
const STORE="gold_study_v2";
let _mem={}; // 内存兜底：当 localStorage 不可用（如沙箱 iframe）时仍能用
function _load(){ try{ return JSON.parse(localStorage.getItem(STORE)||"{}"); }catch(e){ try{return _mem[STORE]?JSON.parse(_mem[STORE]):{};}catch(_){return {};} } }
function _save(s){ try{ localStorage.setItem(STORE,s); }catch(e){ _mem[STORE]=s; } }
let state = _load(); // {moduleIdx:{qIdx:true}}
if(!state || typeof state!=="object" || Array.isArray(state)) state={};
let allExpanded=false;

function save(){_save(JSON.stringify(state));updateBar();}
function updateBar(){
  let answered=0,total=0;
  COURSE.forEach((m,i)=>{
    total+=m.quiz.length;
    answered+=Math.min(state[i]?Object.keys(state[i]).length:0,m.quiz.length);
  });
  let pct=total?Math.round(answered/total*100):0;
  document.getElementById("bar").style.width=pct+"%";
  document.getElementById("pct").textContent=pct+"%";
  document.getElementById("progressTrack").setAttribute("aria-valuenow",String(pct));
  document.getElementById("progressTrack").setAttribute("aria-valuetext",`已答题 ${answered} / ${total}`);
}
function resetAll(){ if(confirm("确定清空所有掌握进度？")){ state={}; save(); location.reload(); } }

function renderChapterNav(){
  const nav=document.getElementById("chapterNav");
  nav.innerHTML="";
  COURSE.forEach((m,mi)=>{
    const btn=document.createElement("button");
    btn.type="button";
    btn.className="chapter-btn"+(mi===0?" active":"");
    btn.dataset.mi=String(mi);
    btn.innerHTML=`<span aria-hidden="true">${String(mi+1).padStart(2,"0")}</span> ${m.short}`;
    btn.addEventListener("click",()=>{
      toggle(mi,true);
      document.getElementById("module"+mi).scrollIntoView({behavior:"smooth",block:"start"});
    });
    nav.appendChild(btn);
  });
}

function setActiveChapter(mi){
  document.querySelectorAll(".chapter-btn").forEach(btn=>{
    btn.classList.toggle("active",Number(btn.dataset.mi)===mi);
  });
}

function render(){
  renderChapterNav();
  const app=document.getElementById("app"); app.innerHTML="";
  COURSE.forEach((m,mi)=>{
    const mod=document.createElement("section");
    mod.className="module"+(mi===0?" open":"");
    mod.id="module"+mi;
    mod.setAttribute("aria-labelledby","moduleTitle"+mi);
    const passed = state[mi]?Object.keys(state[mi]).length:0;
    const done = passed>=m.quiz.length;
    mod.innerHTML=`
      <h2 class="sr-only" id="moduleTitle${mi}">${m.title}</h2>
      <button class="mhead" type="button" aria-expanded="${mi===0}" aria-controls="body${mi}" onclick="toggle(${mi})">
        <div class="no">${mi+1}</div>
        <span class="mhead-title">${m.title}</span>
        <span class="tag">${m.sub}</span>
        <span class="state ${done?'done':''}" id="st${mi}">${done?'已掌握':(passed?('已掌握 '+passed+'/'+m.quiz.length):'未开始')}</span>
        <span class="chevron" aria-hidden="true">⌄</span>
      </button>
      <div class="mbody" id="body${mi}"></div>`;
    app.appendChild(mod);
    const body=mod.querySelector("#body"+mi);
    m.blocks.forEach(b=>{
      const d=document.createElement("div"); d.className="block";
      d.innerHTML=`<span class="lab ${b.cls}">${b.lab}</span>${b.html}`;
      body.appendChild(d);
    });
    const quiz=document.createElement("div"); quiz.className="quiz";
    quiz.innerHTML=`<h3>本节自测（3 题）</h3><p style="margin:-4px 0 10px;color:var(--sub);font-size:12.5px">答对标记掌握；答错给出解析，并进入相似题重测。</p>`;
    m.quiz.forEach((q,qi)=> quiz.appendChild(buildQ(mi,qi,q)));
    body.appendChild(quiz);
  });
  updateBar();
  try{ buildSentence(); }catch(e){}
}

function toggle(mi,force){
  const moduleEl=document.getElementById("module"+mi);
  const open=typeof force==="boolean"?force:!moduleEl.classList.contains("open");
  moduleEl.classList.toggle("open",open);
  moduleEl.querySelector(".mhead").setAttribute("aria-expanded",String(open));
  if(open) setActiveChapter(mi);
}

function toggleAll(){
  allExpanded=!allExpanded;
  COURSE.forEach((_,mi)=>toggle(mi,allExpanded));
  document.getElementById("expandAll").textContent=allExpanded?"全部收起":"全部展开";
  if(!allExpanded) setActiveChapter(0);
}

function buildQ(mi,qi,q){
  const wrap=document.createElement("fieldset"); wrap.className="q";
  wrap.dataset.qi=qi;
  drawQ(wrap,mi,qi,q,q,0);
  return wrap;
}
function drawQ(wrap,mi,qi,q,cur,simIdx){
  const opts=cur.o.map((t,i)=>`<label class="opt" data-i="${i}"><input type="radio" name="q${mi}_${qi}" value="${i}">${t}</label>`).join("");
  wrap.innerHTML=`<legend class="qt">${simIdx>0?'(相似题) ':''}${cur.q}</legend>${opts}
    <div class="qbtns"><button class="b-sub" type="button" onclick="submitQ(this)">提交答案</button></div>
    <div class="fb" id="fb${mi}_${qi}" aria-live="polite"></div>`;
  wrap.querySelectorAll(".opt").forEach(el=>{
    el.addEventListener("click",()=>{
      wrap.querySelectorAll(".opt").forEach(o=>o.classList.remove("sel"));
      el.classList.add("sel");
      el.querySelector("input").checked=true;
    });
  });
  wrap._cur=cur; wrap._simIdx=simIdx;
}
function submitQ(btn){
  const wrap=btn.closest(".q");
  const cur=wrap._cur;
  const checked=wrap.querySelector('input[type=radio]:checked');
  const fb=wrap.querySelector(".fb");
  if(!checked){ fb.className="fb no"; fb.innerHTML="请先选择一个答案。"; return; }
  const ans=parseInt(checked.value);
  wrap.querySelectorAll(".opt").forEach(o=>{
    const i=parseInt(o.dataset.i);
    if(i===cur.a) o.classList.add("correct");
    if(i===ans && i!==cur.a) o.classList.add("wrong");
  });
  btn.disabled=true;
  if(ans===cur.a){
    fb.className="fb ok";
    fb.innerHTML=`<b>答对了。</b>${cur.e}`;
    state[miOf(wrap)]=state[miOf(wrap)]||{}; state[miOf(wrap)][qiOf(wrap)]=true; save();
    refreshState(miOf(wrap));
  }else{
    fb.className="fb no";
    const q=COURSE[miOf(wrap)].quiz[qiOf(wrap)];
    const hasSim=q.sim && q.sim.length>0 && wrap._simIdx < q.sim.length;
    fb.innerHTML=`<b>还没吃透。</b>${cur.e}`+
      (hasSim?`<div class="qbtns" style="margin-top:8px"><button class="b-sim" type="button" onclick="nextSim(this)">再做一道相似题</button></div>`:`<div style="margin-top:6px;font-size:12.5px;color:#7b241c">本题暂无相似题，重读上方“底层逻辑”后再试。</div>`);
  }
}
function miOf(wrap){ return parseInt(wrap.closest(".module").querySelector(".no").textContent)-1; }
function qiOf(wrap){ return parseInt(wrap.dataset.qi); }
function nextSim(btn){
  const wrap=btn.closest(".q");
  const mi=miOf(wrap), qi=qiOf(wrap);
  const q=COURSE[mi].quiz[qi];
  const nxt=wrap._simIdx+1;
  drawQ(wrap,mi,qi,q,q.sim[nxt-1],nxt);
}
function refreshState(mi){
  const m=COURSE[mi];
  const passed=state[mi]?Object.keys(state[mi]).length:0;
  const done=passed>=m.quiz.length;
  const st=document.getElementById("st"+mi);
  st.className="state "+(done?"done":"");
  st.textContent=done?"已掌握":(passed?("已掌握 "+passed+"/"+m.quiz.length):"未开始");
}

function buildSentence(){
  const g=id=>document.getElementById(id).value;
  const out=`在【${g('s1')}】环境下，因为【${g('s2')}】推动美联储【${g('s3')}】，所以实际利率大概率【${g('s4')}】、美元【${g('s5')}】、风险溢价【${g('s6')}】；因此黄金中短期偏【${g('s7')}】。若出现信用/流动性/供给/政策预期反转，则以上逻辑需重新定价。`;
  document.getElementById('sentenceOut').textContent=out;
}
document.getElementById("expandAll").addEventListener("click",toggleAll);

render();
document.querySelectorAll('.gen select').forEach(s=>s.addEventListener('change',buildSentence));
</script>
</body>
</html>
